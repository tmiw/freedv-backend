name: Build and Test
on:
  push

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        is-univ-build: [true, false]
        is-windows-build: [true, false]
        exclude:
        - os: ubuntu-24.04
          is-univ-build: true
        - os: ubuntu-24.04-arm
          is-univ-build: true
          is-windows-build: true
        - os: ubuntu-24.04-arm
          is-univ-build: false
          is-windows-build: true
        - os: ubuntu-24.04-arm
          is-univ-build: true
          is-windows-build: false
        - os: macos-15
          is-windows-build: true

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Install required packages (macOS)
      if: ${{ matrix.os == 'macos-15' }}
      run: |
        brew install automake libtool

    - name: Install required packages (Linux)
      if: ${{ matrix.os != 'macos-15' }}
      run: |
        sudo apt-get update
        sudo apt-get install python3 python3-dev python3-venv

    - name: Install MinGW LLVM (Windows build)
      if: ${{ matrix.is-windows-build == true }}
      run: |
        wget https://github.com/mstorsjo/llvm-mingw/releases/download/20251216/llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz
        tar xvf llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz

    - name: Configure Python
      run: |
        python3 -m venv rade-venv
        . ./rade-venv/bin/activate
        pip install torch matplotlib
     
    - name: Configure build (standard)
      if: ${{ matrix.is-windows-build == false && matrix.is-universal-build == false }}
      run: |
        mkdir build
        cd build
        cmake -DRADAE_PYTHON_EXECUTABLE=${{ github.workspace }}/rade-venv/bin/python3 -DBUILD_BACKEND_UNITTESTS=1 ..

    - name: Configure build (macOS universal)
      if: ${{ matrix.is-universal-build == true }}
      run: |
        mkdir build
        cd build
        cmake -DRADAE_PYTHON_EXECUTABLE=${{ github.workspace }}/rade-venv/bin/python3 -DBUILD_BACKEND_UNITTESTS=1 -DBUILD_OSX_UNIVERSAL=1 ..

    - name: Configure build (Windows)
      if: ${{ matrix.is-windows-build == true }}
      run: |
        mkdir build
        cd build
        export PATH=${{github.workspace}}/llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64/bin:$PATH
        cmake -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/cross-compile/freedv-mingw-llvm-x86_64.cmake ..

    - name: Build backend and tests
      run: |
        cd build
        cmake --build .

    - name: Run tests
      if: ${{ matrix.is-windows-build == false }}
      run: |
        cd build
        ctest -V
